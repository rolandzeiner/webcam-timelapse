# Local gate, run before the commit lands.
#
# The `rev:` values below are hand-synced to the EXACT `==` pins in
# requirements_test.txt. If they drift, the local hook lints with a different
# ruleset than CI and "passes locally" stops meaning anything — which is
# precisely why Dependabot is told to ignore these two repos (see
# .github/dependabot.yml). Bump them together with requirements_test.txt or
# not at all.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5 # == requirements_test.txt
    hooks:
      - id: ruff
        args: [--fix]
      # `ruff check` says NOTHING about formatting. Without this hook the
      # formatter drifts silently until someone finally runs it and the
      # catch-up lands as one unreviewable diff.
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1 # == requirements_test.txt
    hooks:
      - id: mypy
        args: [--strict, --ignore-missing-imports]
        files: ^custom_components/webcam_timelapse/
        additional_dependencies:
          - homeassistant
          - voluptuous

  # Workflow linting lives here rather than in CI, deliberately.
  #
  # Nothing else in the portfolio validates workflow files — CodeQL runs
  # python and javascript-typescript only, and its Actions analysis is
  # security-focused anyway, so it would not catch an invalid expression
  # context. actionlint would: it is what identified the job-level
  # `if: hashFiles(...)` in the scaffold template, which GitHub rejects at
  # parse time while reporting a bare failure with zero jobs.
  #
  # Not added to validate.yml because that workflow runs on a nightly cron.
  # An unpinned linter shipping a new rule turns every repo red overnight
  # with no code change — precisely what ruff 0.16.0 did in July. Here it
  # runs only when a workflow file is staged, costs no CI seconds, and
  # reports at the moment the file is edited.
  #
  # `actionlint-system` uses the Homebrew binary, so no Go toolchain or
  # Docker pull. Keep `rev` equal to that installed version.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-system

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # The frame archive is binary and large; nothing that size belongs in
      # git history.
      - id: check-added-large-files
        args: [--maxkb=600]
