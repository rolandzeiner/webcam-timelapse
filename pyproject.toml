# Source of truth for ruff, mypy, and coverage. Pytest config stays in pytest.ini.
# Pre-commit and CI may still pass equivalent CLI flags — they are now
# redundant with this file but harmless. Trim them as confidence grows.

[tool.ruff]
# MUST equal the OLDEST Python we support, NOT the interpreter CI runs.
# `hacs.json` promises Home Assistant >= 2025.5.0, which runs on
# Python 3.13. Pointing this at the CI pin (3.14) authorises ruff to
# rewrite code into syntax those users cannot parse, and then leaves it
# unflagged — that is how wiener-linien-austria v1.7.1 shipped PEP 758
# `except A, B:` and failed to import below 3.14. The `compile-floor-python`
# CI job is the independent backstop. Raise this only together with the
# `homeassistant` floor in `hacs.json` and that job's `python-version`.
target-version = "py313"
line-length = 88

# The portfolio's Python lint baseline (spanish-breakfast/references/
# python-baseline.md). ruff's defaults are E4, E7, E9 and F; everything
# that finds a bug in HA code is opt-in.
[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # ruff's default set, kept explicit
    "I",                    # isort
    "UP",                   # pyupgrade — safe ONLY while target-version is
                            # the support floor; see the note above it
    "B",                    # flake8-bugbear
    "C4",                   # flake8-comprehensions
    "RET",                  # flake8-return
    "PTH",                  # flake8-use-pathlib
    "SIM",                  # flake8-simplify
    "LOG", "G",             # logging correctness + logging-format
    "T20",                  # no stray print()
    "ASYNC",                # flake8-async
    "DTZ",                  # naive datetimes — the capture grid and the
                            # frame index are wall-clock, so an aware
                            # datetime is the whole point
    "TID",                  # tidy imports
    "ISC",                  # implicit str concat
    "PIE", "RSE", "FURB", "PERF",
    "BLE",                  # broad excepts, each a reasoned noqa
    "SLF",                  # private-member access across class boundaries
    "RUF",                  # ruff-specific, incl. RUF100 dead-noqa
]
allowed-confusables = ["×", "–"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private members on purpose. They also read files and
# poll a task's progress inside `async def`; blocking the test loop is the
# point there, not a bug.
"tests/*" = ["SLF", "ASYNC110", "ASYNC240"]
"scripts/*" = ["T201"]

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["custom_components/webcam_timelapse"]

# Home Assistant 2026.10 annotates its APIs with `probatio.Schema` and aliases
# `voluptuous` to probatio at runtime. mypy cannot see that alias, and the real
# voluptuous package is still installed (annotatedyaml and hass-nabucasa depend
# on it), so every `vol.Schema` handed to Home Assistant looked like an
# unrelated class. Skipping the import types `vol.*` as Any, which is what the
# alias amounts to. Importing probatio directly would need Home Assistant 2026.9.
[[tool.mypy.overrides]]
module = "voluptuous.*"
follow_imports = "skip"

# Home Assistant 2026.10 moved `BinarySensorDeviceClass` and
# `CameraEntityFeature` into each platform's `const.py` and re-imports them
# without `__all__`, which strict mypy does not count as exported. Neither can
# be imported from `.const` before 2026.10, so the imports have to keep
# pointing at the packages.
[[tool.mypy.overrides]]
module = [
    "homeassistant.components.binary_sensor",
    "homeassistant.components.camera",
]
implicit_reexport = true

[tool.coverage.run]
source = ["custom_components/webcam_timelapse"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
skip_empty = true
