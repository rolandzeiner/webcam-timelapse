rules:
  # Bronze
  action-setup:
    status: done
    comment: >-
      Four actions (capture_now, purge_frames, pause_capture, resume_capture)
      registered in async_setup via services.async_setup_services, not in
      async_setup_entry.
  appropriate-polling:
    status: done
    comment: >-
      Captures run on a wall-clock grid via async_track_time_change rather than
      a coordinator update_interval, so frame timestamps are deterministic. The
      interval is user-selected from divisors of 60 minutes; the default of 10
      is deliberately conservative because the polled URL belongs to a third
      party.
  brands:
    status: done
    comment: >-
      Assets in custom_components/webcam_timelapse/brand/ (icon, icon@2x, logo,
      logo@2x plus dark_ variants). HA 2026.3+ prefers local files; the
      home-assistant/brands repo does not accept custom-integration PRs.
  common-modules:
    status: done
  config-flow:
    status: done
  config-flow-test-coverage:
    status: done
    comment: tests/test_config_flow.py covers user, reconfigure, options and reauth.
  dependency-transparency:
    status: done
    comment: Pillow only, declared in manifest requirements with a loose lower bound.
  docs-actions:
    status: done
    comment: README "Actions" documents all four, including the capture_now overwrite refusal.
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-removal-instructions:
    status: done
    comment: README "Remove the integration" covers per-entry frame deletion and HACS removal.
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup:
    status: exempt
    comment: Coordinator pattern; no entity subscribes to events directly.
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
  runtime-data:
    status: done
  test-before-configure:
    status: done
    comment: async_probe_url performs a trial GET and checks the Content-Type.
  test-before-setup:
    status: done
  unique-config-entry:
    status: done
    comment: unique_id is sha256(image_url)[:16], so the same camera cannot be added twice.

  # Silver
  action-exceptions:
    status: done
    comment: >-
      Actions raise ServiceValidationError with translation_domain and
      translation_key (unknown_entry, entry_not_loaded, slot_occupied).
  config-entry-unloading:
    status: done
    comment: async_teardown cancels the capture schedule.
  docs-configuration-parameters:
    status: done
    comment: README "Settings" documents every config-flow field.
  docs-installation-parameters:
    status: done
    comment: README "Set up a camera" walks the flow step by step.
  entity-unavailable:
    status: done
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
    comment: >-
      DataUpdateCoordinator logs the first failure at warning and recovery at
      info. A frozen camera is reported separately via camera_online plus a
      repair issue, because it returns healthy responses and would otherwise
      never be logged at all.
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES = 0 in camera.py, sensor.py and binary_sensor.py.
  reauthentication-flow:
    status: done
    comment: >-
      async_step_reauth + async_step_reauth_confirm. capture.py raises
      ConfigEntryAuthFailed on 401/403, which HA turns into this flow. Relevant
      for cameras behind basic auth.
  test-coverage:
    status: done
    comment: 96%+, gate enforced at 90% via pytest.ini --cov-fail-under.

  # Gold
  devices:
    status: done
    comment: >-
      One device per entry, registered explicitly in __init__.py so it appears
      before any entity reports state. configuration_url points at the camera's
      own origin rather than this repo.
  diagnostics:
    status: done
    comment: >-
      Counts and status only. Credentials and the frames path are redacted; the
      image URL deliberately is not, since it is the key triage field and a
      public webcam address is not a secret.
  discovery:
    status: exempt
    comment: The image URL is user-supplied; there is nothing on the network to discover.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update:
    status: done
    comment: README "How data updates" covers the wall-clock grid, freeze detection and pruning.
  docs-examples:
    status: done
    comment: README shows minimal and full card YAML plus an automation calling capture_now.
  docs-known-limitations:
    status: done
    comment: >-
      README "Known limitations" states the no-backfill property, unauthenticated
      frame serving, absence of a stream, and the coarser-interval behaviour.
  docs-supported-devices:
    status: done
    comment: >-
      Any camera publishing a still image over http(s). Stated in the README
      intro and the "Set up a camera" note about using the direct image link.
  docs-supported-functions:
    status: done
    comment: README "Entities" and "Actions" list everything exposed.
  docs-troubleshooting:
    status: done
    comment: README "Troubleshooting" covers the failure modes seen in practice.
  docs-use-cases:
    status: done
    comment: README "What you can do with it".
  dynamic-devices:
    status: exempt
    comment: One device per entry, fixed at setup; nothing appears at runtime.
  entity-category:
    status: done
    comment: >-
      storage_used and camera_online are EntityCategory.DIAGNOSTIC; the camera,
      last_capture and stored_frames are primary.
  entity-device-class:
    status: done
    comment: >-
      SensorDeviceClass.TIMESTAMP, SensorDeviceClass.DATA_SIZE and
      BinarySensorDeviceClass.CONNECTIVITY. stored_frames has no fitting device
      class and correctly declares none.
  entity-disabled-by-default:
    status: exempt
    comment: Five entities, all useful; none noisy enough to warrant hiding.
  entity-translations:
    status: done
  exception-translations:
    status: done
    comment: Every UpdateFailed and ServiceValidationError carries a translation_key.
  icon-translations:
    status: done
    comment: >-
      icons.json only; no _attr_icon anywhere, including the binary sensor's
      on/off state icons.
  reconfiguration-flow:
    status: done
  repair-issues:
    status: done
    comment: >-
      camera_offline is raised once when consecutive captures come back
      identical and cleared on recovery. It is the only repair issue — the
      condition is genuinely user-actionable.
  stale-devices:
    status: exempt
    comment: See dynamic-devices.

  # Platinum
  async-dependency:
    status: done
    comment: >-
      aiohttp is the API-communication library and is async. Pillow is
      synchronous but is a CPU-only codec, called exclusively through
      hass.async_add_executor_job — never from the event loop. encode.py and
      frame_store.py import nothing from homeassistant, which makes an
      accidental direct call visible on review.
  inject-websession:
    status: done
    comment: async_get_clientsession(hass) in both capture.py and config_flow.py.
  strict-typing:
    status: done
    comment: py.typed present; CI runs mypy --strict.
