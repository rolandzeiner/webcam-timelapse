version: 2

# Monthly + grouped + auto-merge-friendly. Rationale, the companion auto-merge
# workflow, and the hard-won gotchas: see the ha-integration-platinum reference
# `references/dependabot-and-automerge.md`.
#
# `target-branch: dev` routes update PRs to the working branch (this scaffold
# uses the dev -> PR -> main flow — see CONTRIBUTING). The config FILE itself is
# always read from the repo's DEFAULT branch. Remove every `target-branch: dev`
# line if the repo has no dev branch (Dependabot then targets the default branch).
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"          # no prefix-development — unsupported for github-actions
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]   # majors -> individual PRs (manual review)
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      python-dev:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]

  # Card-side npm deps. Keep this block whenever the integration ships a
  # `package.json` (i.e. you scaffolded with the `ha-lovelace-card` skill or
  # copied the optional/lovelace-card subtree). Drop the WHOLE block if the
  # integration has no card — Dependabot errors on an npm block with no manifest.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      card-deps:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # TypeScript 7 (tsgo/native compiler) — hold. TS 7 drops the JS
      # compiler API, which breaks @rollup/plugin-typescript outright
      # even though `tsc --noEmit` still passes. Revisit only when the
      # bundler plugin ships TS 7 support; see ha-lovelace-card gotchas.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Without this block the .pre-commit-config.yaml `rev:` pins rot
  # silently — nothing else tracks them. (Measured 2026-07: four of five
  # repos were still on a 2024-era ruff hook.)
  - package-ecosystem: pre-commit
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"          # no prefix-development — unsupported here
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      pre-commit:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pre-commit-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # The ruff and mypy hook revs are hand-kept equal to the `==` pins
      # in requirements_test.txt. Letting Dependabot float them here
      # would desync the local gate from CI — exactly what the exact
      # pins exist to prevent. Bump them by hand, with the pin.
      # Name format verified against dependabot-core's pre_commit
      # file_parser: it builds Dependency.new(name: repo_url), so the
      # full URL exactly as written under `repo:` is correct.
      - dependency-name: "https://github.com/astral-sh/ruff-pre-commit"
      - dependency-name: "https://github.com/pre-commit/mirrors-mypy"
      # A hook's `additional_dependencies` are parsed as dependencies in
      # their OWN right — ignoring the hook repo above does not cover
      # them. These are deliberately unpinned (the hook only needs them
      # importable for type resolution; the real HA version is governed
      # by PHACC in requirements_test.txt), so ignore them too rather
      # than let Dependabot introduce a competing pin here.
      - dependency-name: "homeassistant"
      - dependency-name: "voluptuous"
