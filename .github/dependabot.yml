version: 2

# Monthly + grouped. Rationale and the hard-won gotchas live in
# austria-portfolio-workflow -> references/repo-settings-baseline.md.
#
# `target-branch: dev` routes update PRs to the working branch, matching the
# dev -> PR -> main flow. The config FILE itself is always read from the
# repo's DEFAULT branch, so this file only takes effect once it lands on
# `main`.
#
# Monthly rather than weekly: weekly generated ~70 PRs/month across the
# portfolio, nearly all superseded within days. It costs nothing in security
# coverage — `interval` throttles only *version* updates, while Dependabot
# security updates fire on advisory publication regardless.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore" # no prefix-development — unsupported for github-actions
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        # Majors get their own PR so a breaking change never rides in with
        # the safe patches.
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      python-dev:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      card-deps:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # TypeScript 7 (tsgo) — hold. TS 7 drops the JS compiler API, so
      # @rollup/plugin-typescript fails at config load even though
      # `tsc --noEmit` passes. Revisit when the plugin supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pre-commit
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore" # no prefix-development — unsupported here
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      pre-commit:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pre-commit-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Hand-synced to the `==` pins in requirements_test.txt. If Dependabot
      # bumped these independently the local hook would lint with a different
      # ruleset than CI — exactly the drift the pins exist to prevent.
      - dependency-name: "https://github.com/astral-sh/ruff-pre-commit"
      - dependency-name: "https://github.com/pre-commit/mirrors-mypy"
      # A hook's `additional_dependencies` are parsed as dependencies in their
      # OWN right — the repo-URL ignores above do not cover them.
      - dependency-name: "homeassistant"
      - dependency-name: "voluptuous"
