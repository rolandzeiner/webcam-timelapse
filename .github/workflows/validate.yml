name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  no-dev-fixture:
    # `_dev_fixture.py` is a gitignored, dev-only hook some integrations
    # ship to inject a recorded payload during local development. It
    # must never enter the repo — gitignore covers accidental staging,
    # this guards against `git add -f` or the rule being deleted. Loud,
    # fast, first job. Delete the job if your integration never uses
    # the dev-fixture pattern.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify _dev_fixture.py is not committed
        run: |
          if [ -f custom_components/webcam_timelapse/_dev_fixture.py ]; then
            echo "::error::custom_components/webcam_timelapse/_dev_fixture.py must never be committed (dev-only hook)."
            exit 1
          fi

  compile-floor-python:
    # Every other job runs the newest interpreter (3.14). `hacs.json` promises
    # Home Assistant >= 2025.5.0, which runs on Python 3.13 —
    # so without this job the whole gate is blind to syntax that parses on 3.14
    # but not on the floor, and CI goes green on code your users cannot import.
    # wiener-linien-austria v1.7.1 shipped exactly that.
    #
    # `ruff check` catches it too when `target-version` is pinned to the floor
    # (see pyproject.toml). This job is the independent backstop: it asks the
    # real interpreter, so it also covers syntax no linter rule models. Bump
    # `python-version` only together with the `homeassistant` floor in
    # `hacs.json` and `target-version` in `pyproject.toml`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Byte-compile the shipped package on the oldest supported Python
        run: python -m compileall -q custom_components/webcam_timelapse

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Login to ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Pinned to 3.14 — HA core 2026.5.0 requires Python ≥3.14.2,
          # and PHACC 0.13.317+ wraps that HA. The earlier pyo3 0.24
          # build blocker on 3.14 is gone: orjson 3.11.8, Pillow 12.2.0,
          # and pydantic-core 2.46.2 all ship cp314 wheels (verified
          # 2026-05-07). Bump again once HA core jumps to 3.15, together
          # with the PHACC floor in `requirements_test.txt` — those two
          # are the "runtime" axis and move together.
          #
          # Do NOT bump `pyproject.toml ruff target-version` with them.
          # That is the "floor" axis: it tracks the OLDEST Python the
          # `hacs.json` HA floor supports, and is deliberately lower than
          # this pin. See the `compile-floor-python` job above.
          python-version: "3.14"
      - name: Install uv
        # uv replaces pip for resolution + install: faster, cached, and
        # consistent with the local dev workflow (uv-built venvs). Its
        # resolver surfaces hard PHACC transitive pins (e.g.
        # pytest-asyncio==1.4.0) clearly, so the test-floor lockstep holds.
        #
        # Pin the EXACT version. setup-uv stopped publishing rolling
        # major tags after v7 — `@v8` / `@v9` do not resolve and fail the
        # job with "unable to find version". Only `vX.Y.Z` tags exist.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv pip install --system -r requirements_test.txt
      - name: Run Linter (Ruff)
        # ruff is pinned in requirements_test.txt (where Dependabot tracks
        # it) and installed above — no separate install needed.
        run: ruff check .
      - name: Check formatting (Ruff)
        # `ruff check` says NOTHING about formatting — without this step
        # the formatter drifts silently for as long as nobody runs it,
        # and the eventual catch-up reformats the whole tree in one
        # unreviewable diff (measured 2026-07: 15-28 files per repo
        # across a five-repo portfolio, ~18 months of accumulated drift).
        run: ruff format --check .
      - name: Run mypy (strict)
        run: mypy --strict --ignore-missing-imports custom_components/webcam_timelapse
      - name: Run tests
        run: pytest tests/ -v

  validate-card:
    # Rebuilds the Lovelace card bundle from src/ and verifies the output
    # is valid JS. Catches TS errors, missing deps, and high-severity npm
    # advisories before they reach the served www/webcam-timelapse-card.js.
    #
    # The scaffold guarded this with `if: hashFiles('package.json') != ''`
    # so Python-only integrations skip it. That is invalid: hashFiles is
    # not available in a job-level `if` (only always/success/failure/
    # cancelled are), and GitHub rejects the whole workflow at parse time
    # with a startup failure and zero jobs — which reads as "everything
    # failed" rather than "the file is malformed". This repo always ships
    # a card, so the guard is unnecessary here.
    #
    # No separate guard for a stray backtick inside a Lit css/html template:
    # it ends the template early, and `vp check`'s type-check reports every
    # shape of that (unknown property, syntax error), which the old regex
    # guard could not, since it ended each template at the stray backtick.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        # Installs the global vp CLI, Node and npm (from devEngines), and
        # caches npm's store. Install runs as its own step below so the
        # lockfile is enforced explicitly.
        with:
          node-version: "24"
          cache: true
          run-install: false
      - name: Install card deps
        run: vp install --frozen-lockfile
      - name: Audit production deps
        # --omit=dev keeps the gate enforceable; without it build-tooling
        # advisories (which never ship to users) flood the report and the
        # team learns to ignore failures.
        run: npm audit --omit=dev --audit-level=high
      - name: Format, lint and type-check (strict)
        # `vp check` = Oxfmt + Oxlint + tsgolint type-check (typeCheck in
        # vite.config.ts). The ONLY type-check in the pipeline: the build
        # transpiles without type-checking, so nothing else in this workflow
        # would notice a type error. Never make this step conditional.
        run: vp check
      - name: Card unit tests
        # The build strips types without checking them and `vp check` checks
        # types without running anything, so this is the only step that
        # proves the card's logic still behaves. Ahead of the build so a
        # logic regression fails before we spend time bundling.
        run: vp test run
      - name: Build card bundle
        run: vp build
      - name: Assert the committed bundle matches a fresh build
        # The build above regenerates www/ from src/. Any diff means the
        # committed bundle is stale — someone changed src/ and didn't
        # rebuild. Nothing else in the gate catches this:
        # tests/test_versions.py compares manifest.json against
        # src/const.ts, i.e. source vs source, and never looks at the
        # built artefact.
        #
        # Shipping it stale is the infinite-reload-banner bug: the card's
        # WebSocket version check sees the bundle's old CARD_VERSION,
        # shows the reload banner, the reload re-serves the same stale JS,
        # and the banner comes straight back — for every HACS user.
        run: |
          if ! git diff --exit-code -- custom_components/webcam_timelapse/www/; then
            echo "::error::Committed card bundle differs from a fresh build."
            echo "::error::Run 'vp build' (or 'npm run build') and commit custom_components/webcam_timelapse/www/."
            exit 1
          fi
      - name: Syntax-check bundle
        # `node -c` parses without executing — cheapest possible check that
        # Rolldown didn't somehow produce malformed JS.
        run: node -c custom_components/webcam_timelapse/www/webcam-timelapse-card.js
